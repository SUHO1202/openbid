<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오픈비드(OpenBid) - 유형별 3대 탭 & 스마트 등록폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=50e6236d3a240baf3fd89b589bc40840&libraries=services"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    .custom-pin { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
    .custom-pin:hover { transform: translateY(-4px) scale(1.06); z-index: 9999 !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden select-none">

  <!-- 1. 메인 헤더 -->
  <header class="bg-white border-b border-slate-200 px-5 py-2.5 flex justify-between items-center z-30 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5">
        <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-lg shadow-sm">O</div>
        <span class="text-xl font-black text-slate-900 tracking-tight">OPEN<span class="text-blue-600">BID</span></span>
      </div>
      <span class="hidden md:inline-block text-[11px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full font-bold">유형별 맞춤 오픈비드</span>
    </div>

    <!-- 모드 스위치 -->
    <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
      <button onclick="switchMarketMode('normal')" id="mode-normal" class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold bg-white text-blue-600 shadow-sm">🏢 일반 매물</button>
      <button onclick="switchMarketMode('reverse')" id="mode-reverse" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">🔥 역경매 대기표</button>
    </div>

    <!-- 시점 전환 및 매물 관리 버튼 -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center bg-slate-900 text-white p-1 rounded-xl text-xs">
        <span class="px-2 text-[11px] text-slate-300 font-medium">시점:</span>
        <button onclick="toggleRole('visitor')" id="role-visitor" class="px-2.5 py-1 rounded-lg font-bold bg-blue-600 text-white">👁️ 방문자</button>
        <button onclick="toggleRole('owner')" id="role-owner" class="px-2.5 py-1 rounded-lg font-medium text-slate-300">🔑 집주인</button>
      </div>
      <button onclick="openManagerModal()" class="bg-slate-800 text-white px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-slate-700 transition">📋 내 매물 관리</button>
      <button onclick="openRegisterModal()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-extrabold hover:bg-blue-700 shadow-md">+ 매물 등록</button>
    </div>
  </header>

  <!-- 2. 상단 3대 카테고리 탭 바 -->
  <div class="bg-white border-b border-slate-200 px-5 py-2 flex flex-wrap justify-between items-center z-20 text-xs gap-2">
    <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
      <button onclick="switchCategory('apartment')" id="tab-apartment" class="px-4 py-1.5 rounded-lg font-extrabold bg-blue-600 text-white shadow-sm transition">🏢 아파트 / 오피스텔</button>
      <button onclick="switchCategory('commercial')" id="tab-commercial" class="px-4 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition">🏪 수익형 상가</button>
      <button onclick="switchCategory('villa')" id="tab-villa" class="px-4 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition">🏡 다세대·단독·다가구</button>
    </div>

    <div class="text-[11px] text-slate-500 font-semibold">
      💡 <span class="text-blue-600 font-bold">파란색 핀 = 매매</span> / <span class="text-purple-600 font-bold">보라색 핀 = 전월세</span>
    </div>
  </div>

  <!-- 3. 메인 워크스페이스 -->
  <div class="flex-1 flex overflow-hidden relative">
    <div class="w-7/12 h-full relative border-r border-slate-300 z-10">
      <div id="map" class="w-full h-full"></div>
      
      <!-- 로드뷰 오버레이 -->
      <div id="roadview-Wrap" class="hidden absolute inset-0 bg-slate-900 z-[500] flex flex-col">
        <div class="bg-slate-900 text-white px-4 py-2.5 flex justify-between items-center">
          <span id="rv-title" class="text-sm font-bold">로드뷰</span>
          <button onclick="closeRoadview()" class="bg-rose-600 text-white px-3 py-1 rounded-lg text-xs font-bold">✕ 닫기</button>
        </div>
        <div id="roadview" class="flex-1 w-full"></div>
      </div>

      <!-- 지도 컨트롤 -->
      <div class="absolute top-3 right-3 z-[400] flex flex-col space-y-2">
        <button onclick="toggleCadastral()" id="btn-cadastral" class="bg-white/95 backdrop-blur-md px-3.5 py-2 rounded-xl shadow-lg border text-xs font-black text-slate-800 hover:bg-amber-50">📐 지적도 켜기</button>
        <button onclick="openRoadview()" class="bg-white/95 backdrop-blur-md px-3.5 py-2 rounded-xl shadow-lg border text-xs font-black text-slate-800 hover:bg-amber-50">📸 로드뷰 보기</button>
      </div>
    </div>

    <!-- 우측 패널 -->
    <div class="w-5/12 bg-white flex flex-col h-full overflow-hidden z-10">
      <div class="flex-1 overflow-y-auto p-6">
        <div class="border-b border-slate-100 pb-4 mb-4">
          <div class="flex items-center justify-between">
            <span id="detail-badge" class="bg-blue-100 text-blue-800 text-xs font-extrabold px-2.5 py-1 rounded-md">아파트 매매</span>
            <span id="detail-Location" class="text-xs font-bold text-slate-500">주소</span>
          </div>
          <h2 id="detail-title" class="text-xl font-black mt-2 text-slate-900">제목</h2>
        </div>

        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-5 grid grid-cols-3 gap-2 text-center shadow-sm">
          <div><div id="box-label-1" class="text-[11px] text-slate-400 font-bold">매도가</div><div id="stat-val-1" class="text-base font-black text-slate-900 mt-0.5">-</div></div>
          <div class="border-l border-r border-slate-200 px-1"><div id="box-label-2" class="text-[11px] text-slate-400 font-bold">보증금 / 월세</div><div id="stat-val-2" class="text-sm font-extrabold text-slate-800 mt-1">-</div></div>
          <div><div id="box-label-3" class="text-[11px] text-slate-400 font-bold">특징 / 수익률</div><div id="stat-val-3" class="text-base font-black text-blue-600 mt-0.5">-</div></div>
        </div>

        <div class="flex justify-between items-center mb-3">
          <h3 class="font-extrabold text-slate-900 text-sm">📊 실시간 듀얼트랙 오퍼 현황</h3>
          <span id="bid-count-badge" class="text-xs bg-rose-100 text-rose-600 px-2.5 py-0.5 rounded-full font-extrabold">총 0건</span>
        </div>

        <div id="bid-list-container" class="space-y-2.5 mb-4"></div>
      </div>

      <!-- 하단 오퍼 입력 -->
      <div class="bg-slate-50 p-4 border-t border-slate-200">
        <div class="flex space-x-1.5 mb-2 text-xs">
          <button onclick="selectTrack('direct')" id="track-btn-direct" class="flex-1 py-1.5 rounded-lg font-extrabold bg-white text-blue-600 border shadow-sm">트랙A: 직거래</button>
          <button onclick="selectTrack('agent')" id="track-btn-agent" class="flex-1 py-1.5 rounded-lg font-bold text-slate-600 border">트랙B: 중개사</button>
        </div>
        <div class="flex space-x-2 mb-2">
          <input id="input-price" type="number" placeholder="제안 금액 (만원)" class="w-full border rounded-xl px-3 py-2 text-xs font-bold bg-white outline-none">
          <select id="input-sub-option" class="border rounded-xl px-2 py-2 text-xs font-bold bg-white outline-none">
            <option value="조건 협의 가능">조건 협의 가능</option>
            <option value="즉시 계약 희망">즉시 계약 희망</option>
          </select>
        </div>
        <div class="flex space-x-2">
          <input id="input-condition" type="text" placeholder="상세 조건 입력" class="border rounded-xl px-3 py-2 text-xs flex-1 bg-white outline-none">
          <button onclick="submitOffer()" class="bg-blue-600 text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow-md shrink-0">오퍼 등록</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. 스마트 매물 등록 모달 -->
  <div id="register-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-[480px] shadow-2xl border">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-base font-black text-slate-900">📍 새 매물 등록하기</h3>
        <button onclick="closeRegisterModal()" class="text-slate-400 font-bold text-lg">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-bold block mb-1">부동산 유형</label>
            <select id="reg-cat" class="w-full border rounded-xl p-2 font-bold bg-slate-50">
              <option value="apartment">아파트 / 오피스텔</option>
              <option value="commercial">수익형 상가</option>
              <option value="villa">다세대·단독·다가구</option>
            </select>
          </div>
          <div>
            <label class="font-bold block mb-1">거래 방식</label>
            <select id="reg-dealType" onchange="onRegDealTypeChange()" class="w-full border rounded-xl p-2 font-bold bg-slate-50">
              <option value="sale">매매</option>
              <option value="lease">전월세</option>
            </select>
          </div>
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">도로명 주소 검색</label>
          <div class="flex space-x-2">
            <input id="reg-address" type="text" readonly placeholder="우측 버튼 클릭" class="flex-1 border rounded-xl p-2 bg-slate-50 font-bold">
            <button onclick="execKakaoPostcode()" class="bg-amber-400 text-slate-950 font-black px-3 py-2 rounded-xl">주소검색</button>
          </div>
        </div>
        <div><label class="font-bold block mb-1">매물 제목</label><input id="reg-title" type="text" placeholder="예: 마포래미안 34평 로얄동" class="w-full border rounded-xl p-2 font-medium"></div>
        
        <!-- 전월세 vs 매매에 따라 다르게 보이는 입력폼 -->
        <div id="reg-price-container" class="grid grid-cols-3 gap-2">
          <div><label class="font-bold block mb-1" id="label-p1">매도가(만)</label><input id="reg-price" type="number" placeholder="150000" class="w-full border rounded-xl p-2"></div>
          <div id="reg-box-dep"><label class="font-bold block mb-1">보증금(만)</label><input id="reg-dep" type="number" placeholder="0" class="w-full border rounded-xl p-2"></div>
          <div id="reg-box-rent"><label class="font-bold block mb-1">월세(만)</label><input id="reg-rent" type="number" placeholder="0" class="w-full border rounded-xl p-2"></div>
        </div>
      </div>
      <div class="mt-5 flex space-x-2">
        <button onclick="closeRegisterModal()" class="flex-1 py-2 rounded-xl border text-slate-600 font-bold">취소</button>
        <button onclick="saveNewListing()" class="flex-1 py-2 rounded-xl bg-blue-600 text-white font-extrabold">등록하기</button>
      </div>
    </div>
  </div>

  <!-- 5. 내 매물 관리(수정/삭제) 모달 -->
  <div id="manager-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-[560px] shadow-2xl border max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-base font-black text-slate-900">📋 내가 등록한 매물 관리</h3>
        <button onclick="closeManagerModal()" class="text-slate-400 font-bold text-lg">✕</button>
      </div>
      <div id="manager-list" class="flex-1 overflow-y-auto space-y-3 pr-1 text-xs"></div>
    </div>
  </div>

  <!-- 6. 매물 수정 모달 -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-[480px] shadow-2xl border">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-base font-black text-slate-900">✏️ 매물 정보 수정하기</h3>
        <button onclick="closeEditModal()" class="text-slate-400 font-bold text-lg">✕</button>
      </div>
      <input type="hidden" id="edit-id">
      <div class="space-y-3 text-xs">
        <div><label class="font-bold block mb-1">매물 제목</label><input id="edit-title" type="text" class="w-full border rounded-xl p-2 font-medium"></div>
        <div class="grid grid-cols-3 gap-2">
          <div><label class="font-bold block mb-1">매도가/보증금(만)</label><input id="edit-price" type="number" class="w-full border rounded-xl p-2"></div>
          <div><label class="font-bold block mb-1">보증금(만)</label><input id="edit-dep" type="number" class="w-full border rounded-xl p-2"></div>
          <div><label class="font-bold block mb-1">월세(만)</label><input id="edit-rent" type="number" class="w-full border rounded-xl p-2"></div>
        </div>
      </div>
      <div class="mt-5 flex space-x-2">
        <button onclick="closeEditModal()" class="flex-1 py-2 rounded-xl border text-slate-600 font-bold">취소</button>
        <button onclick="saveEditedListing()" class="flex-1 py-2 rounded-xl bg-blue-600 text-white font-extrabold">수정 완료</button>
      </div>
    </div>
  </div>

  <script>
    // category: 'apartment', 'commercial', 'villa' / dealType: 'sale', 'lease'
    let listings = [
      { id: 'item1', mode: 'normal', category: 'apartment', dealType: 'sale', badge: '아파트 매매', location: '서울 마포구 아현동 777', title: '마포래미안푸르지오 34평 남향 매매', lat: 37.5562, lng: 126.9536, priceMan: 165000, depositMan: 0, rentMan: 0, yieldRate: 0, offers: [{ track: 'direct', priceMan: 162000, subOpt: '실거주 직거래', cond: '즉시 입주' }] },
      { id: 'item2', mode: 'normal', category: 'apartment', dealType: 'lease', badge: '아파트 전세', location: '서울 마포구 공덕동 450', title: '공덕 파크자이 로얄층 아파트 전세', lat: 37.5430, lng: 126.9510, priceMan: 90000, depositMan: 90000, rentMan: 0, yieldRate: 0, offers: [{ track: 'direct', priceMan: 90000, subOpt: '대출 가능', cond: '즉시 입주' }] },
      { id: 'item3', mode: 'normal', category: 'commercial', dealType: 'sale', badge: '상가 매매', location: '서울 강남구 역삼동 152', title: '강남구 역삼동 초역세권 1층 수익형 상가 매매', lat: 37.5006, lng: 127.0364, priceMan: 100000, depositMan: 5000, rentMan: 400, yieldRate: 5.05, offers: [{ track: 'agent', priceMan: 99500, subOpt: '중개보수 0.3%', cond: '프랜차이즈 대기' }] },
      { id: 'item4', mode: 'normal', category: 'commercial', dealType: 'lease', badge: '상가 월세', location: '서울 강남구 테헤란로 100', title: '역삼역 1층 코너 상가 월세', lat: 37.5015, lng: 127.0380, priceMan: 5000, depositMan: 5000, rentMan: 350, yieldRate: 0, offers: [{ track: 'direct', priceMan: 5000, subOpt: '보증금 조정', cond: '카페 창업' }] },
      { id: 'item5', mode: 'normal', category: 'villa', dealType: 'sale', badge: '주택 매매', location: '서울 종로구 서촌 12', title: '서촌 리모델링 단독주택 매매', lat: 37.5791, lng: 126.9704, priceMan: 85000, depositMan: 0, rentMan: 0, yieldRate: 0, offers: [] },
      { id: 'item6', mode: 'normal', category: 'villa', dealType: 'lease', badge: '빌라 전세', location: '서울 용산구 이태원동 88', title: '이태원 신축 빌라 투룸 전세', lat: 37.5340, lng: 126.9940, priceMan: 45000, depositMan: 45000, rentMan: 0, yieldRate: 0, offers: [] }
    ];

    let currentMarketMode = 'normal';
    let currentCategory = 'apartment'; // 기본 아파트 탭
    let currentRole = 'visitor';
    let selectedId = 'item1';
    let currentTrack = 'direct';

    let kakaoMap = null;
    let kakaoMarkers = [];
    let isCadastralOn = false;

    function initKakaoMap() {
      kakaoMap = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(37.5562, 126.9536),
        level: 5
      });
      renderMarkers();
    }

    function toggleCadastral() {
      isCadastralOn = !isCadastralOn;
      const btn = document.getElementById('btn-cadastral');
      if (isCadastralOn) {
        kakaoMap.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        btn.innerText = "📐 지적도 켜짐 ✓";
      } else {
        kakaoMap.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        btn.innerText = "📐 지적도 켜기";
      }
    }

    function openRoadview() {
      const item = listings.find(x => x.id === selectedId);
      if (!item) return;
      document.getElementById('roadview-Wrap').classList.remove('hidden');
      document.getElementById('rv-title').innerText = `${item.title} (${item.location})`;
      const rv = new kakao.maps.Roadview(document.getElementById('roadview'));
      const rvClient = new kakao.maps.RoadviewClient();
      const pos = new kakao.maps.LatLng(item.lat, item.lng);
      rvClient.getNearestPanoId(pos, 50, function(panoId) {
        if (panoId) rv.setPanoId(panoId, pos);
        else { alert('주변 로드뷰 데이터가 없습니다.'); closeRoadview(); }
      });
    }
    function closeRoadview() { document.getElementById('roadview-Wrap').classList.add('hidden'); }

    function execKakaoPostcode() {
      new daum.Postcode({
        oncomplete: function(data) {
          document.getElementById('reg-address').value = data.roadAddress || data.jibunAddress;
        }
      }).open();
    }

    function formatPriceMan(man, dealType) {
      if (dealType === 'lease' && man < 50000) {
        return `보증금 ${man.toLocaleString()}만`;
      }
      const eok = Math.floor(man / 10000);
      const rest = man % 10000;
      if (eok > 0 && rest > 0) return `${eok}억 ${rest.toLocaleString()}만`;
      if (eok > 0) return `${eok}억`;
      return `${man.toLocaleString()}만`;
    }

    // 3대 탭 전환
    function switchCategory(cat) {
      currentCategory = cat;
      ['apartment', 'commercial', 'villa'].forEach(c => {
        const btn = document.getElementById(`tab-${c}`);
        if(btn) {
          btn.className = c === cat ? "px-4 py-1.5 rounded-lg font-extrabold bg-blue-600 text-white shadow-sm transition" : "px-4 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition";
        }
      });
      renderMarkers();
    }

    function renderMarkers() {
      if (!kakaoMap) return;
      kakaoMarkers.forEach(m => m.setMap(null));
      kakaoMarkers = [];

      const filtered = listings.filter(item => {
        if (item.mode !== currentMarketMode) return false;
        if (item.category !== currentCategory) return false;
        return true;
      });

      filtered.forEach(item => {
        // 색상 구분: 매매는 파란색, 전월세는 보자주색 계열
        const pinBg = item.dealType === 'sale' ? 'bg-blue-600' : 'bg-purple-600';

        const content = document.createElement('div');
        content.className = `custom-pin ${pinBg} text-white px-3 py-1.5 rounded-2xl shadow-xl border-2 border-white whitespace-nowrap`;
        
        let priceTag = formatPriceMan(item.priceMan, item.dealType);
        if (item.dealType === 'lease' && item.rentMan > 0) {
          priceTag = `${formatPriceMan(item.priceMan, 'lease')}/${item.rentMan}만`;
        }

        content.innerHTML = `
          <div class="text-[10px] font-bold opacity-95">${item.location.substring(0, 10)}</div>
          <div class="font-black text-xs">${priceTag} <span class="bg-slate-950 text-amber-300 px-1 rounded text-[10px]">오퍼 ${item.offers.length}건</span></div>
        `;
        content.onclick = () => {
          selectListing(item.id);
          kakaoMap.panTo(new kakao.maps.LatLng(item.lat, item.lng));
        };

        const overlay = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(item.lat, item.lng),
          content: content,
          yAnchor: 1
        });
        overlay.setMap(kakaoMap);
        kakaoMarkers.push(overlay);
      });

      if (filtered.length > 0 && !filtered.find(x => x.id === selectedId)) {
        selectListing(filtered[0].id);
      } else if (filtered.length > 0) {
        selectListing(selectedId);
      }
    }

    function selectListing(id) {
      selectedId = id;
      const item = listings.find(x => x.id === id);
      if (!item) return;

      document.getElementById('detail-badge').innerText = item.badge;
      document.getElementById('detail-badge').className = item.dealType === 'sale' ? "bg-blue-100 text-blue-800 text-xs font-extrabold px-2.5 py-1 rounded-md" : "bg-purple-100 text-purple-800 text-xs font-extrabold px-2.5 py-1 rounded-md";
      document.getElementById('detail-Location').innerText = item.location;
      document.getElementById('detail-title').innerText = item.title;

      if (item.dealType === 'sale') {
        document.getElementById('box-label-1').innerText = "매도가";
        document.getElementById('box-label-2').innerText = "보증금 / 월세";
        document.getElementById('box-label-3').innerText = "수익률 / 특징";
        document.getElementById('stat-val-1').innerText = formatPriceMan(item.priceMan, 'sale');
        document.getElementById('stat-val-2').innerText = item.rentMan > 0 ? `${item.depositMan.toLocaleString()}만/${item.rentMan}만` : `공실/입주협의`;
        document.getElementById('stat-val-3').innerText = item.yieldRate > 0 ? `${item.yieldRate}%` : '실거주 매매';
      } else {
        document.getElementById('box-label-1').innerText = "보증금 (전세가)";
        document.getElementById('box-label-2').innerText = "월세 금액";
        document.getElementById('box-label-3').innerText = "입주 조건";
        document.getElementById('stat-val-1').innerText = formatPriceMan(item.priceMan, 'lease');
        document.getElementById('stat-val-2').innerText = item.rentMan > 0 ? `${item.rentMan}만 원` : `전세 (무월세)`;
        document.getElementById('stat-val-3').innerText = "즉시 입주가능";
      }

      renderOffers(item);
    }

    function renderOffers(item) {
      const container = document.getElementById('bid-list-container');
      document.getElementById('bid-count-badge').innerText = `총 ${item.offers.length}건 경쟁중`;
      container.innerHTML = '';

      item.offers.forEach((offer) => {
        const isDirect = offer.track === 'direct';
        container.innerHTML += `
          <div class="p-3.5 rounded-2xl border ${isDirect ? 'border-blue-200 bg-blue-50/40' : 'border-purple-200 bg-purple-50/40'} flex justify-between items-center shadow-sm">
            <div>
              <div class="flex items-center space-x-1.5">
                <span class="text-[10px] font-bold ${isDirect ? 'bg-blue-600' : 'bg-purple-600'} text-white px-2 py-0.5 rounded">${isDirect ? '직거래' : '중개사'}</span>
                <span class="font-black text-slate-900 text-sm">${formatPriceMan(offer.priceMan, item.dealType)}</span>
                <span class="text-[10px] text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded">${offer.subOpt}</span>
              </div>
              <p class="text-xs text-slate-600 mt-1">조건: ${offer.cond}</p>
            </div>
            ${currentRole === 'owner' ? `<button onclick="alert('채택 완료')" class="bg-slate-900 text-white text-xs font-bold px-3 py-1 rounded-xl">채택</button>` : `<span class="text-[11px] text-slate-400 bg-white px-2 py-1 rounded border">집주인 전용</span>`}
          </div>
        `;
      });
    }

    function toggleRole(role) {
      currentRole = role;
      document.getElementById('role-visitor').className = role === 'visitor' ? "px-2.5 py-1 rounded-lg font-bold bg-blue-600 text-white" : "px-2.5 py-1 rounded-lg font-medium text-slate-300";
      document.getElementById('role-owner').className = role === 'owner' ? "px-2.5 py-1 rounded-lg font-extrabold bg-amber-400 text-slate-950" : "px-2.5 py-1 rounded-lg font-medium text-slate-300";
      selectListing(selectedId);
    }

    function switchMarketMode(mode) {
      currentMarketMode = mode;
      document.getElementById('mode-normal').className = mode === 'normal' ? "px-3.5 py-1.5 rounded-lg text-xs font-extrabold bg-white text-blue-600 shadow-sm" : "px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-600";
      document.getElementById('mode-reverse').className = mode === 'reverse' ? "px-3.5 py-1.5 rounded-lg text-xs font-extrabold bg-amber-500 text-white shadow-sm" : "px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-600";
      renderMarkers();
    }

    function selectTrack(track) {
      currentTrack = track;
      document.getElementById('track-btn-direct').className = track === 'direct' ? "flex-1 py-1.5 rounded-lg font-extrabold bg-white text-blue-600 border shadow-sm" : "flex-1 py-1.5 rounded-lg font-bold text-slate-600 border";
      document.getElementById('track-btn-agent').className = track === 'agent' ? "flex-1 py-1.5 rounded-lg font-extrabold bg-white text-purple-600 border shadow-sm" : "flex-1 py-1.5 rounded-lg font-bold text-slate-600 border";
    }

    function submitOffer() {
      const priceMan = parseInt(document.getElementById('input-price').value, 10);
      const subOpt = document.getElementById('input-sub-option').value;
      const cond = document.getElementById('input-condition').value.trim();
      if (!priceMan || !cond) return alert('제안 금액과 조건을 입력해 주세요!');
      listings.find(x => x.id === selectedId).offers.unshift({ track: currentTrack, priceMan, subOpt, cond });
      document.getElementById('input-price').value = '';
      document.getElementById('input-condition').value = '';
      selectListing(selectedId);
      renderMarkers();
    }

    // 등록 모달 및 스마트 폼 제어
    function openRegisterModal() { document.getElementById('register-modal').classList.remove('hidden'); }
    function closeRegisterModal() { document.getElementById('register-modal').classList.add('hidden'); }

    function onRegDealTypeChange() {
      const dealType = document.getElementById('reg-dealType').value;
      const labelP1 = document.getElementById('label-p1');
      const boxDep = document.getElementById('reg-box-dep');
      const boxRent = document.getElementById('reg-box-rent');

      if (dealType === 'sale') {
        labelP1.innerText = "매도가(만)";
        boxDep.style.display = "block";
        boxRent.style.display = "block";
      } else {
        labelP1.innerText = "보증금/전세(만)";
        boxDep.style.display = "none";
        boxRent.style.display = "block";
      }
    }

    function saveNewListing() {
      const cat = document.getElementById('reg-cat').value;
      const dealType = document.getElementById('reg-dealType').value;
      const loc = document.getElementById('reg-address').value || '서울 마포구 아현동';
      const title = document.getElementById('reg-title').value || '신규 등록 매물';
      const priceMan = parseInt(document.getElementById('reg-price').value, 10) || 10000;
      const depMan = dealType === 'sale' ? (parseInt(document.getElementById('reg-dep').value, 10) || 0) : priceMan;
      const rentMan = parseInt(document.getElementById('reg-rent').value, 10) || 0;
      const yieldRate = (dealType === 'sale' && rentMan > 0) ? parseFloat((((rentMan * 12) / (priceMan - depMan)) * 100).toFixed(2)) : 0;

      const catNameMap = { apartment: '아파트', commercial: '상가', villa: '주택' };
      const badgeText = `${catNameMap[cat]} ${dealType === 'sale' ? '매매' : '전월세'}`;

      const geocoder = new kakao.maps.services.Geocoder();
      geocoder.addressSearch(loc, function(result, status) {
        let lat = 37.5562, lng = 126.9536;
        if (status === kakao.maps.services.Status.OK) {
          lat = parseFloat(result[0].y);
          lng = parseFloat(result[0].x);
        }
        const newId = 'item_' + Date.now();
        listings.unshift({
          id: newId, mode: 'normal', category: cat, dealType,
          badge: badgeText, location: loc, title, lat, lng,
          priceMan, depositMan: depMan, rentMan, yieldRate, offers: []
        });
        closeRegisterModal();
        switchCategory(cat);
        renderMarkers();
        selectListing(newId);
        kakaoMap.panTo(new kakao.maps.LatLng(lat, lng));
      });
    }

    // 관리(수정/삭제) 모달
    function openManagerModal() {
      const container = document.getElementById('manager-list');
      container.innerHTML = '';
      if (listings.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 py-6">등록된 매물이 없습니다.</div>`;
      } else {
        listings.forEach(item => {
          container.innerHTML += `
            <div class="p-3 rounded-xl border border-slate-200 bg-slate-50 flex justify-between items-center">
              <div>
                <div class="font-extrabold text-slate-900">[${item.badge}] ${item.title}</div>
                <div class="text-[11px] text-slate-500">${item.location} | 가격: ${formatPriceMan(item.priceMan, item.dealType)}</div>
              </div>
              <div class="flex space-x-1.5">
                <button onclick="openEditModal('${item.id}')" class="bg-blue-100 text-blue-700 font-bold px-2.5 py-1 rounded-lg">수정</button>
                <button onclick="deleteListing('${item.id}')" class="bg-rose-100 text-rose-700 font-bold px-2.5 py-1 rounded-lg">삭제</button>
              </div>
            </div>
          `;
        });
      }
      document.getElementById('manager-modal').classList.remove('hidden');
    }
    function closeManagerModal() { document.getElementById('manager-modal').classList.add('hidden'); }

    function deleteListing(id) {
      if (!confirm('정말 이 매물을 삭제하시겠습니까?')) return;
      listings = listings.filter(x => x.id !== id);
      renderMarkers();
      openManagerModal();
    }

    function openEditModal(id) {
      const item = listings.find(x => x.id === id);
      if (!item) return;
      document.getElementById('edit-id').value = item.id;
      document.getElementById('edit-title').value = item.title;
      document.getElementById('edit-price').value = item.priceMan;
      document.getElementById('edit-dep').value = item.depositMan;
      document.getElementById('edit-rent').value = item.rentMan;
      document.getElementById('edit-modal').classList.remove('hidden');
    }
    function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

    function saveEditedListing() {
      const id = document.getElementById('edit-id').value;
      const item = listings.find(x => x.id === id);
      if (!item) return;

      item.title = document.getElementById('edit-title').value;
      item.priceMan = parseInt(document.getElementById('edit-price').value, 10) || item.priceMan;
      item.depositMan = parseInt(document.getElementById('edit-dep').value, 10) || item.depositMan;
      item.rentMan = parseInt(document.getElementById('edit-rent').value, 10) || item.rentMan;

      closeEditModal();
      openManagerModal();
      renderMarkers();
      selectListing(id);
    }

    kakao.maps.load(function() {
      initKakaoMap();
    });
  </script>
</body>
</html>
